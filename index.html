<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RENDIMENTOS DE FRIOS - APARAS • v9</title>
<style>
:root{
  color-scheme:light;
  --bg:#eaf1f8;
  --panel:#f7fbff;
  --panel-2:#edf5fb;
  --input:#f1f7fc;
  --text:#132033;
  --muted:#65758b;
  --line:#cbd9e7;
  --accent:#008e83;
  --accent-strong:#006f67;
  --accent-soft:rgba(0,142,131,.13);
  --good:#0078ff;
  --good-soft:#ddecff;
  --bad:#f02f4b;
  --bad-soft:#ffe0e6;
  --header-card:#f4f9fe;
  --loss-card:#e4f3ff;
  --loss-line:#9ccff3;
  --tol-card:#e2f8f1;
  --tol-line:#91d9c4;
  --typed-card:#fff3d7;
  --typed-line:#edcf85;
  --key:#f0f6fb;
  --key-line:#c5d7e6;
  --key-alt:#e2f0ff;
  --key-danger:#ffe3e8;
}
body[data-theme="dark"]{
  color-scheme:dark;
  --bg:#08111f;
  --panel:#101b2c;
  --panel-2:#16243a;
  --input:#122035;
  --text:#f4f8ff;
  --muted:#91a2b9;
  --line:#2a3a52;
  --accent:#22d3bd;
  --accent-strong:#0fae99;
  --accent-soft:rgba(34,211,189,.15);
  --good:#39aaff;
  --good-soft:#102d4a;
  --bad:#ff5368;
  --bad-soft:#3a1d2a;
  --header-card:#101b2c;
  --loss-card:#10283c;
  --loss-line:#22577b;
  --tol-card:#12322d;
  --tol-line:#246e60;
  --typed-card:#28243b;
  --typed-line:#514b73;
  --key:#15243a;
  --key-line:#2a405d;
  --key-alt:#193353;
  --key-danger:#3c202c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{
  font-family:'Segoe UI',Roboto,Arial,sans-serif;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  color:var(--text);
  user-select:none;
  transition:background .2s ease,color .2s ease;
}
button,input{font:inherit}
.app{
  min-height:100dvh;
  max-width:540px;
  margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px);
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* CABEÇALHO */
.header{
  contain:layout paint;
  background:var(--header-card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:12px;
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{min-width:0}
.brand-title{font-size:1rem;font-weight:900;line-height:1.05;letter-spacing:.15px}
.brand-title span{color:var(--accent)}
.brand-sub{font-size:.68rem;color:var(--muted);font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.theme-toggle{
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--text);
  border-radius:999px;
  padding:8px 11px;
  display:flex;align-items:center;gap:7px;
  font-size:.74rem;font-weight:850;cursor:pointer;white-space:nowrap;
}
.theme-toggle:active{transform:scale(.98)}

/* BUSCA */
.search-wrap{position:relative}
#prodSearch{
  width:100%;
  height:46px;
  padding:0 43px 0 13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--input);
  color:var(--text);
  outline:none;
  font-size:16px;
  font-weight:700;
}
#prodSearch::placeholder{color:var(--muted);font-weight:600}
#prodSearch:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.clear-btn{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border:0;border-radius:50%;
  background:var(--panel-2);color:var(--muted);font-weight:900;
  display:none;align-items:center;justify-content:center;cursor:pointer;
}
.clear-btn.on{display:flex}
.suggestions{
  position:absolute;left:0;right:0;top:calc(100% + 7px);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  max-height:46vh;
  overflow:auto;
  z-index:100;
  display:none;
}
.suggestions.on{display:block}
.sug{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sug:last-child{border-bottom:0}
.sug:active{background:var(--panel-2)}
.sug.on{background:var(--accent-soft);border-left:4px solid var(--accent)}
.sug-name{font-size:.87rem;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-name mark{background:transparent;color:var(--accent);font-weight:900}
.sug-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:.67rem;color:var(--muted);font-weight:750}
.sug-meta b{color:var(--accent);font-weight:900}
.sug-dest{margin-top:4px;font-size:.66rem;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-dest b{color:var(--text);font-weight:850}
.sug-empty{padding:18px 12px;text-align:center;color:var(--muted);font-size:.83rem;font-weight:750}

/* PRODUTO SELECIONADO + PERDA/TOLERÂNCIA */
.product-panel{
  margin-top:8px;
  display:none;
  border-top:1px solid var(--line);
  padding-top:9px;
}
.product-panel.on{display:block}
.product-line{display:flex;align-items:flex-start;gap:8px}
.product-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;margin-top:5px;flex:0 0 auto}
.product-copy{min-width:0;flex:1}
.product-name{font-size:.82rem;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-plu{font-size:.66rem;color:var(--muted);font-weight:800;margin-top:3px}
.product-plu b{color:var(--accent)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.metric{
  border:1px solid var(--line);
  border-radius:13px;
  padding:8px 9px;
  text-align:center;
}
.metric:first-child{background:var(--loss-card);border-color:var(--loss-line)}
.metric:nth-child(2){background:var(--tol-card);border-color:var(--tol-line)}
.metric span{display:block;font-size:.56rem;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:850}
.metric b{display:block;margin-top:3px;font-size:.95rem;color:var(--accent);font-weight:900;font-variant-numeric:tabular-nums}

/* RESULTADO */
.result{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:20px;
  padding:13px 12px;
  text-align:center;
  min-height:78px;
  display:flex;flex-direction:column;justify-content:center;
}
.result.blue{background:var(--good-soft);border-color:var(--good);border-width:2px}
.result.red{background:var(--bad-soft);border-color:var(--bad);border-width:2px}
.r-label{font-size:.66rem;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}
.r-value{font-size:1.5rem;font-weight:900;line-height:1.05;margin-top:5px;color:var(--text);font-variant-numeric:tabular-nums}
.result.blue .r-label,.result.blue .r-value{color:var(--good)}
.result.red .r-label,.result.red .r-value{color:var(--bad)}
.result.blue .r-sub{color:var(--good)}
.result.red .r-sub{color:var(--bad)}
.r-sub{font-size:.64rem;color:var(--muted);font-weight:800;margin-top:4px;text-transform:uppercase;letter-spacing:.8px}

/* VALOR DIGITADO */
.typed-card{
  border:1px solid var(--typed-line);
  background:var(--typed-card);
  border-radius:20px;
  padding:10px 12px;
}
.typed-title{font-size:.61rem;color:var(--muted);font-weight:900;letter-spacing:1.2px;text-transform:uppercase;text-align:right}
.typed{font-size:clamp(2.2rem,12vw,3.25rem);font-weight:900;line-height:1;text-align:right;margin-top:3px;font-variant-numeric:tabular-nums;word-break:break-all}
.typed-unit{font-size:.64rem;color:var(--muted);font-weight:800;letter-spacing:1.6px;text-transform:uppercase;text-align:right;margin-top:4px}

/* TECLADO */
.keypad{
  contain:layout paint;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:0;
}
.key{
  min-height:64px;
  border:1px solid var(--key-line);
  border-radius:18px;
  background:var(--key);
  color:var(--text);
  font-size:1.5rem;
  font-weight:850;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
  transition:transform .07s,background .1s;
}
.key:active{transform:scale(.97);background:var(--panel-2)}
.key.fn{background:var(--key-alt);color:var(--accent);font-size:1.02rem;font-weight:900}
.key.del{background:var(--key-danger);color:var(--bad);font-size:1.25rem;font-weight:900}
.key.zero{grid-column:span 3;justify-content:flex-start;padding-left:24px}
.key.ok{background:var(--accent);border-color:transparent;color:#fff;font-size:.98rem;font-weight:900;letter-spacing:.8px}
.key.ok:active{background:var(--accent-strong)}

@media (max-height:760px){
  .app{gap:6px;padding-top:6px;padding-bottom:8px}
  .header{padding:10px}
  .topbar{margin-bottom:8px}
  #prodSearch{height:42px}
  .result{padding:10px;min-height:68px}
  .typed-card{padding:8px 10px}
  .key{min-height:58px}
  .metrics{margin-top:6px}
}

@media (max-width:390px){
  .app{padding-left:9px;padding-right:9px;gap:6px}
  .header{padding:10px;border-radius:18px}
  .brand-title{font-size:.94rem}
  .brand-sub{font-size:.62rem}
  .theme-toggle{padding:7px 9px;font-size:.69rem}
  #prodSearch{height:44px}
  .metrics{gap:6px}
  .metric{padding:7px 6px}
  .metric b{font-size:.9rem}
  .result{border-radius:18px;min-height:72px}
  .r-value{font-size:1.35rem}
  .typed-card{border-radius:18px;padding:9px 10px}
  .keypad{gap:6px}
  .key{min-height:60px;border-radius:16px}
}
@media (max-height:680px){
  .app{gap:5px;padding-top:5px;padding-bottom:6px}
  .header{padding:9px}
  .topbar{margin-bottom:7px}
  .product-panel{margin-top:6px;padding-top:7px}
  .metrics{margin-top:6px}
  .metric{padding:6px 8px}
  .result{padding:8px 10px;min-height:60px}
  .typed-card{padding:7px 10px}
  .typed{font-size:clamp(2rem,10vw,2.8rem)}
  .key{min-height:52px}
}

body.mobile-html-keypad #prodSearch{
  pointer-events:none;
  caret-color:transparent;
  cursor:pointer;
  user-select:none;
}
body.mobile-html-keypad .search-wrap{
  cursor:pointer;
}
body.mobile-html-keypad #prodSearch:focus{
  box-shadow:none;
}

</style>

const $=id=>document.getElementById(id);
const STORE_LAST='rendimentos:last';
const STORE_THEME='rendimentos:theme';

// Nomes amigáveis do projeto. A base original continua preservada em P.
const DISPLAY_BASE={
  '92296':'QUEIJO COALHO C. GRANDE'
};
const DISPLAY_RELATED={
  '50951':'QUEIJO COALHO C. GRANDE'
};
function displayBaseName(x){ return DISPLAY_BASE[x.b] || x.n; }
function displayRelatedName(x){ return DISPLAY_RELATED[x.r] || x.nr; }

let curP=null, buf='', searchMode=false;
const IS_TOUCH=('ontouchstart' in window) || navigator.maxTouchPoints>0 || window.matchMedia('(pointer: coarse)').matches;
const IS_MOBILE=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (IS_TOUCH && window.innerWidth<=900);

function norm(s){
  return s.toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9 ]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function matches(x,q){
  if(!q) return true;
  const qn=norm(q);
  const hay=norm(x.n+' '+displayBaseName(x)+' '+x.b+' '+x.r+' '+x.nr+' '+displayRelatedName(x));
  return qn.split(' ').every(term=>hay.includes(term));
}
function highlight(text,q){
  if(!q) return text;
  const terms=norm(q).split(' ').filter(Boolean);
  if(!terms.length) return text;
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('('+terms.map(esc).join('|')+')','gi');
  return text.replace(re,'<mark>$1</mark>');
}
function renderSuggestions(){
  const q=$('prodSearch').value.trim();
  const box=$('suggestions');
  if(!q){box.classList.remove('on');box.innerHTML='';return;}
  const list=P.filter(x=>matches(x,q)).slice(0,30);
  if(!list.length){
    box.innerHTML='<div class="sug-empty">Nenhum produto encontrado.</div>';
    box.classList.add('on');return;
  }
  box.innerHTML=list.map(x=>{
    const on=curP&&curP.n===x.n&&curP.b===x.b&&curP.r===x.r;
    return `<div class="sug${on?' on':''}" data-n="${encodeURIComponent(x.n)}" data-b="${x.b}" data-r="${x.r}">
      <div class="sug-name">${highlight(displayBaseName(x),q)}</div>
      <div class="sug-meta">
        <span>Origem <b>${x.b}</b></span>
        <span>Destino <b>${x.r}</b></span>
        <span>Perda <b>${x.p.toFixed(3).replace('.',',')} kg</b></span>
        <span>Tol. <b>${x.pc}</b></span>
      </div>
      <div class="sug-dest">Destino: <b>${highlight(displayRelatedName(x),q)}</b></div>
    </div>`;
  }).join('');
  box.classList.add('on');
}
function getSearchMatches(q){
  const term=(q||'').trim();
  if(!term) return [];
  return P.filter(x=>matches(x,term));
}
function chooseBestMatch(q){
  const term=(q||'').trim();
  if(!term) return null;
  const qn=norm(term);
  const list=getSearchMatches(term);
  if(!list.length) return null;

  // Prioridade: PLU destino exato → PLU origem exato → nome exato → primeiro resultado.
  return list.find(x=>String(x.r)===term)
      || list.find(x=>String(x.b)===term)
      || list.find(x=>norm(x.n)===qn)
      || list.find(x=>norm(displayBaseName(x))===qn)
      || list.find(x=>norm(x.nr)===qn)
      || list.find(x=>norm(displayRelatedName(x))===qn)
      || list[0];
}
function selectFromSearch(){
  const prod=chooseBestMatch($('prodSearch').value);
  if(!prod) return false;
  selectProduct(prod);
  return true;
}

function setSearchMode(on=true){
  searchMode=!!on;
  if(searchMode){
    buf='';
    if(curP){
      $('prodSearch').value='';
      $('clearBtn').classList.remove('on');
    }
    $('cTyped').textContent=$('prodSearch').value || '0';
    const title=document.querySelector('.typed-title');
    const unit=document.querySelector('.typed-unit');
    if(title) title.textContent='Código do produto';
    if(unit) unit.textContent='PLU';
    renderSuggestions();
  }else{
    const title=document.querySelector('.typed-title');
    const unit=document.querySelector('.typed-unit');
    if(title) title.textContent='Valor digitado';
    if(unit) unit.textContent='kg';
    refresh();
  }
}

function updateSearchFromKeypad(value){
  $('prodSearch').value=value;
  $('clearBtn').classList.toggle('on',!!value);
  $('cTyped').textContent=value || '0';
  renderSuggestions();
}

function updateProductPanel(prod){
  if(!prod){
    $('productPanel').classList.remove('on');
    $('chipTxt').textContent='—';
    $('chipPlu').textContent='—';
    return;
  }
  $('productPanel').classList.add('on');
  $('chipTxt').textContent=displayBaseName(prod);
  $('chipPlu').innerHTML='PLU origem <b>'+prod.b+'</b> &nbsp;→&nbsp; destino <b>'+prod.r+'</b>';
}
function selectProduct(prod){
  searchMode=false;
  curP=prod;
  buf='';
  const title=document.querySelector('.typed-title');
  const unit=document.querySelector('.typed-unit');
  if(title) title.textContent='Valor digitado';
  if(unit) unit.textContent='kg';
  $('prodSearch').value=displayBaseName(prod);
  $('clearBtn').classList.add('on');
  $('suggestions').classList.remove('on');
  updateProductPanel(prod);
  $('cPerda').textContent=prod.p.toFixed(3).replace('.',',')+' kg';
  $('cPct').textContent=prod.pc;
  try{localStorage.setItem(STORE_LAST,JSON.stringify({b:prod.b,r:prod.r,n:prod.n}));}catch(e){}
  refresh();
  if(document.activeElement) document.activeElement.blur();
}
function pickProduct(el){
  const n=decodeURIComponent(el.dataset.n);
  const b=el.dataset.b;
  const r=el.dataset.r;
  const prod=P.find(x=>x.n===n&&x.b===b&&x.r===r);
  if(prod) selectProduct(prod);
}
function clearSearch(){
  searchMode=true;
  buf='';
  $('prodSearch').value='';
  $('clearBtn').classList.remove('on');
  $('suggestions').classList.remove('on');
  curP=null;
  updateProductPanel(null);
  $('cPerda').textContent='—';
  $('cPct').textContent='—';
  try{localStorage.removeItem(STORE_LAST);}catch(e){}
  setSearchMode(true);
}
function fmt(kg){
  return kg.toFixed(3).replace('.',',')+' kg  ('+Math.round(kg*1000)+' g)';
}
function refresh(){
  $('cTyped').textContent=buf||'0';
  const res=$('cResult');
  const v=parseFloat(buf.replace(',','.'))||0;
  if(!curP){
    res.className='result';
    $('cResLabel').textContent='Selecione o produto';
    $('cResValue').textContent='—';
    return;
  }
  if(v<=0){
    res.className='result';
    $('cResLabel').textContent='Aguardando peso';
    $('cResValue').textContent='—';
    return;
  }
  const perda=curP.p;
  if(v>perda){
    res.className='result red';
    $('cResLabel').textContent='QUEBRA';
    $('cResValue').textContent=fmt(v-perda);
  }else{
    res.className='result blue';
    $('cResLabel').textContent='RENDIMENTO';
    $('cResValue').textContent=fmt(perda-v);
  }
}
function press(k){
  if(navigator.vibrate) navigator.vibrate(8);

  // No celular, quando o campo de produto está ativo, o mesmo teclado HTML digita o PLU.
  if(searchMode){
    let value=$('prodSearch').value.trim();
    if(k==='ok'){
      if(selectFromSearch()) setSearchMode(false);
      return;
    }
    if(k==='clr'){
      updateSearchFromKeypad('');
      return;
    }
    if(k==='del'){
      updateSearchFromKeypad(value.slice(0,-1));
      return;
    }
    if(k===',') return;
    if(/^[0-9]$/.test(k) && value.length<6){
      updateSearchFromKeypad(value+k);
    }
    return;
  }

  if(k==='ok'){if(document.activeElement) document.activeElement.blur();return;}
  if(k==='clr'){buf='';refresh();return;}
  if(k==='del'){buf=buf.slice(0,-1);refresh();return;}
  if(k===','){
    if(!buf) buf='0,';
    else if(!buf.includes(',')) buf+=',';
    refresh();return;
  }
  if(buf.includes(',')){
    if(buf.split(',')[1].length>=3) return;
  }else{
    if(buf==='0') buf='';
    if(buf.length>=4) return;
  }
  buf+=k;
  refresh();
}
function applyTheme(theme){
  const next=theme==='light'?'light':'dark';
  document.body.setAttribute('data-theme',next);
  const dark=next==='dark';
  $('themeIcon').textContent=dark?'☀️':'🌙';
  $('themeText').textContent=dark?'Claro':'Escuro';
  $('themeToggle').setAttribute('aria-label',dark?'Ativar modo claro':'Ativar modo escuro');
}
function toggleTheme(){
  const current=document.body.getAttribute('data-theme')==='light'?'light':'dark';
  const next=current==='dark'?'light':'dark';
  applyTheme(next);
  try{localStorage.setItem(STORE_THEME,next);}catch(e){}
}

$('prodSearch').addEventListener('input',()=>{
  $('clearBtn').classList.toggle('on',!!$('prodSearch').value);
  renderSuggestions();
});

// Desktop continua permitindo digitação física normal.
$('prodSearch').addEventListener('focus',()=>{
  if(!IS_MOBILE && $('prodSearch').value) renderSuggestions();
});
$('prodSearch').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    if(selectFromSearch()) setSearchMode(false);
  }else if(e.key==='Escape'){
    e.preventDefault();
    $('suggestions').classList.remove('on');
    $('prodSearch').blur();
  }
});

// CELULAR: o toque é capturado pelo container. O input nunca recebe foco,
// portanto Android/iPhone não conseguem abrir o teclado nativo.
function activateHtmlProductKeypad(e){
  if(!IS_MOBILE) return;
  if(e && (e.target.closest('.clear-btn') || e.target.closest('.suggestions'))) return;
  if(e && e.cancelable) e.preventDefault();
  $('prodSearch').blur();
  setSearchMode(true);
}
const searchWrap=document.querySelector('.search-wrap');
searchWrap.addEventListener('pointerdown',activateHtmlProductKeypad,{passive:false});
searchWrap.addEventListener('touchstart',activateHtmlProductKeypad,{passive:false});
searchWrap.addEventListener('click',activateHtmlProductKeypad);
$('clearBtn').addEventListener('click',clearSearch);
$('themeToggle').addEventListener('click',toggleTheme);
$('suggestions').addEventListener('click',e=>{const el=e.target.closest('.sug');if(el) pickProduct(el);});
document.addEventListener('click',e=>{
  const box=$('suggestions');
  if(!box.classList.contains('on')) return;
  if(e.target.closest('.search-wrap')) return;
  box.classList.remove('on');
});
$('keypad').addEventListener('click',e=>{const b=e.target.closest('.key');if(b) press(b.dataset.k);});
document.addEventListener('keydown',e=>{
  if(searchMode){
    if(/^[0-9]$/.test(e.key)){e.preventDefault();press(e.key);}
    else if(e.key==='Backspace'){e.preventDefault();press('del');}
    else if(e.key==='Enter'){e.preventDefault();press('ok');}
    else if(e.key==='Escape'){e.preventDefault();setSearchMode(false);}
    return;
  }
  if(document.activeElement===$('prodSearch')){
    if(e.key==='Escape'){$('suggestions').classList.remove('on');$('prodSearch').blur();}
    return;
  }
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key===','||e.key==='.') press(',');
  else if(e.key==='Backspace'){e.preventDefault();press('del');}
  else if(e.key.toLowerCase()==='c') press('clr');
  else if(e.key==='Enter') press('ok');
  else if(e.key==='Escape') press('clr');
});
(function init(){
  try{applyTheme(localStorage.getItem(STORE_THEME)||'dark');}catch(e){applyTheme('dark');}
  try{
    const saved=JSON.parse(localStorage.getItem(STORE_LAST)||'null');
    if(saved){
      const prod=P.find(x=>x.b===saved.b&&x.r===saved.r&&x.n===saved.n);
      if(prod) selectProduct(prod);
    }
  }catch(e){}
  if(IS_MOBILE){
    document.body.classList.add('mobile-html-keypad');
    $('prodSearch').readOnly=true;
    $('prodSearch').tabIndex=-1;
    $('prodSearch').setAttribute('inputmode','none');
    $('prodSearch').setAttribute('aria-label','Campo de PLU controlado pelo teclado da página');
  }else{
    $('prodSearch').readOnly=false;
    $('prodSearch').removeAttribute('readonly');
    $('prodSearch').removeAttribute('tabindex');
    $('prodSearch').setAttribute('inputmode','text');
  }
  refresh();
})();
</script>
